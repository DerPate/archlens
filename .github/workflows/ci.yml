name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin

      - name: Build and test
        run: mvn verify -B -q -Ddependency-check.skip=true

      - name: Compute OWASP cache week
        if: github.event_name == 'push'
        id: cache-week
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP dependency-check data
        if: github.event_name == 'push'
        id: owasp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.cache-week.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: OWASP dependency check
        if: github.event_name == 'push'
        id: dependency-check
        run: >-
          mvn dependency-check:check -B -q
          -DdataDirectory=$HOME/.cache/dependency-check
          -DnvdValidForHours=24
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      # steps.dependency-check.outcome is 'failure' whenever a CVSS>=7 finding
      # trips failBuildOnCVSS, even though the NVD data itself updated fine.
      # Save on both success and failure so a legitimate vulnerability finding
      # doesn't also discard the just-downloaded database and force every
      # subsequent run back into a multi-hour full resync. Only skip the save
      # on 'cancelled' (timeout, partial/corrupt data) or 'skipped'.
      - name: Save OWASP dependency-check data
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.owasp-cache.outputs.cache-hit != 'true' &&
          (steps.dependency-check.outcome == 'success' || steps.dependency-check.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.cache-week.outputs.value }}
